<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Tabuada</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        h1, h2, h3 { color: #333; margin-top: 0; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; width: 100%; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn:hover { background: #0069d9; }
        .btn-sec { background: #6c757d; }
        .btn-sec:hover { background: #5a6268; }
        .btn-warn { background: #ffc107; color: #333; }
        .btn-warn:hover { background: #e0a800; }
        .btn-sm { padding: 6px 12px; font-size: 14px; width: auto; margin: 0; }
        input[type="text"], select { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; text-align: center; margin-bottom: 10px; }
        
        /* Barra de Progresso */
        .progress-container { background: #e0e0e0; border-radius: 10px; height: 20px; width: 100%; margin: 10px 0 5px 0; overflow: hidden; }
        .progress-bar { background: #28a745; height: 100%; width: 0%; transition: width 0.25s ease; }
        .progress-text { font-size: 14px; font-weight: bold; color: #555; }

        /* Teclado Numérico */
        .display-answer { font-size: 32px; font-weight: bold; height: 52px; line-height: 50px; border: 2px solid #007bff; border-radius: 8px; margin: 10px 0; background: #f8f9fa; color: #333; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .key { background: #e9ecef; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 8px; color: #333; cursor: pointer; user-select: none; }
        .key:active { background: #ced4da; }
        .key-danger { background: #dc3545; color: white; }
        .key-danger:active { background: #bd2130; }

        .question { font-size: 38px; font-weight: bold; color: #007bff; margin: 10px 0; min-height: 52px; display: flex; align-items: center; justify-content: center; }

        .hidden { display: none !important; }
        .profile-item { display: flex; justify-content: space-between; align-items: center; background: #e9ecef; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; text-align: left; }
        
        .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .rank-table th, .rank-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .rank-table th { background-color: #007bff; color: white; }

        .timer-display { font-size: 18px; font-weight: bold; color: #dc3545; margin: 6px 0; }
        .controls-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <!-- TELA DE PERFIS E RANKING -->
    <div id="screen-profiles">
        <h2>Desafio da Tabuada</h2>
        <div id="profile-list"></div>
        <hr>
        <input type="text" id="new-profile-name" placeholder="Nome do novo perfil" maxlength="15">
        <button class="btn" onclick="createProfile()">Criar Perfil</button>

        <hr style="margin: 20px 0;">
        <h3>🏆 Ranking de Níveis Concluídos</h3>
        <div id="ranking-container">
            <p style="color: #777; font-size: 14px;">Nenhum nível concluído ainda.</p>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="screen-game" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong id="user-display" style="font-size: 16px;"></strong>
            <button class="btn btn-sec btn-sm" onclick="exitToProfiles()">Sair / Perfil</button>
        </div>

        <div style="margin-top: 10px;">
            <label for="select-level" style="font-weight: bold;">Nível Atual: </label>
            <select id="select-level" style="width: auto; display: inline-block; padding: 6px 10px;" onchange="changeLevel(this.value)"></select>
        </div>

        <div class="timer-display">⏱️ Tempo: <span id="timer-text">00:00</span></div>

        <div class="controls-row">
            <button class="btn btn-warn btn-sm" id="btn-pause" onclick="togglePause()">Pausar</button>
            <button class="btn btn-sec btn-sm" onclick="restartLevel()">Reiniciar Nível</button>
        </div>

        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">0.00%</div>

        <div class="question" id="question-display">1 × 1 = ?</div>

        <div class="display-answer" id="answer-display"></div>

        <div id="game-controls">
            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key key-danger" onclick="clearAnswer()">C</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key key-danger" onclick="backspace()">⌫</button>
            </div>

            <button class="btn" onclick="submitAnswer()">Responder</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ESTADO PERSISTENTE E VARIÁVEIS DE SESSÃO
    // ==========================================
    let profiles = JSON.parse(localStorage.getItem('tabuada_v4_profiles')) || {};
    let ranking = JSON.parse(localStorage.getItem('tabuada_v4_ranking')) || [];
    let currentProfileName = null;

    let activeCard = null; // { a, b, type: 'deck' | 'punishment' | 'filler', deckIndex: number, punishmentIndex: number }
    let displayA = 0;
    let displayB = 0;
    let lastShownPair = null; // [displayA, displayB] da rodada imediatamente anterior
    let inputAnswer = "";
    let timerInterval = null;
    let isPaused = false;

    function saveData() {
        localStorage.setItem('tabuada_v4_profiles', JSON.stringify(profiles));
        localStorage.setItem('tabuada_v4_ranking', JSON.stringify(ranking));
    }

    // ==========================================
    // REGRAS DE GERAÇÃO DE BARALHO E NÍVEIS
    // ==========================================
    function getMaxFactorB(level) {
        return level <= 10 ? 10 : level;
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function buildDeck(level) {
        const reps = (level <= 2) ? 1 : 2;
        const maxB = getMaxFactorB(level);
        const deck = [];
        for (let r = 0; r < reps; r++) {
            for (let a = 1; a <= level; a++) {
                for (let b = 1; b <= maxB; b++) {
                    deck.push([a, b]);
                }
            }
        }
        return shuffle(deck);
    }

    function setupLevelState(profile, level) {
        profile.level = level;
        if (!profile.maxLevelUnlocked || level > profile.maxLevelUnlocked) {
            profile.maxLevelUnlocked = level;
        }
        profile.deck = buildDeck(level);
        profile.punishments = []; // Lista de { a, b, remaining }
        profile.punishmentCursor = 0; // Índice da próxima punição no bloco atual
        profile.inPunishmentSweep = false; // Indica se está varrendo o bloco de punições
        profile.normalRoundsSincePunishment = 0; // Conta até 2 rodadas normais entre varreduras
        profile.timeElapsed = 0;
        profile.completedWeight = 0;
        profile.totalWeight = profile.deck.length;
    }

    function ensureProfileIntegrity(profile) {
        if (!profile.level) profile.level = 1;
        if (!profile.maxLevelUnlocked) profile.maxLevelUnlocked = profile.level;
        if (!Array.isArray(profile.deck)) profile.deck = [];
        if (!Array.isArray(profile.punishments)) profile.punishments = [];
        if (typeof profile.punishmentCursor !== 'number') profile.punishmentCursor = 0;
        if (typeof profile.inPunishmentSweep !== 'boolean') profile.inPunishmentSweep = false;
        if (typeof profile.normalRoundsSincePunishment !== 'number') profile.normalRoundsSincePunishment = 0;
        if (typeof profile.timeElapsed !== 'number') profile.timeElapsed = 0;

        if (profile.punishmentCursor >= profile.punishments.length) {
            profile.punishmentCursor = 0;
            profile.inPunishmentSweep = false;
        }

        if (profile.deck.length === 0 && profile.punishments.length === 0) {
            setupLevelState(profile, profile.level);
        }

        const pendingPunishments = profile.punishments.reduce((acc, item) => acc + item.remaining, 0);
        const remainingTotal = profile.deck.length + pendingPunishments;
        if (typeof profile.totalWeight !== 'number' || profile.totalWeight < remainingTotal) {
            profile.totalWeight = remainingTotal;
        }
        if (typeof profile.completedWeight !== 'number') {
            profile.completedWeight = Math.max(0, profile.totalWeight - remainingTotal);
        }
    }

    // ==========================================
    // UTILITÁRIOS MATEMÁTICOS
    // ==========================================
    function isSameAccount(pair1, pair2) {
        if (!pair1 || !pair2) return false;
        return (pair1[0] === pair2[0] && pair1[1] === pair2[1]) ||
               (pair1[0] === pair2[1] && pair1[1] === pair2[0]);
    }

    function randomAccount(level) {
        const maxB = getMaxFactorB(level);
        return [
            Math.floor(Math.random() * level) + 1,
            Math.floor(Math.random() * maxB) + 1
        ];
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    // ==========================================
    // CRONÔMETRO E CONTROLES DE ESTADO
    // ==========================================
    function startTimer() {
        stopTimer();
        timerInterval = setInterval(() => {
            if (!isPaused && currentProfileName && profiles[currentProfileName]) {
                profiles[currentProfileName].timeElapsed++;
                updateTimerUI();
                saveData();
            }
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function updateTimerUI() {
        const p = profiles[currentProfileName];
        if (p) {
            document.getElementById('timer-text').innerText = formatTime(p.timeElapsed);
        }
    }

    function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById('btn-pause');
        const controls = document.getElementById('game-controls');
        const qDisplay = document.getElementById('question-display');

        if (isPaused) {
            btn.innerText = "Continuar";
            btn.className = "btn btn-sm";
            controls.classList.add('hidden');
            qDisplay.innerText = "PAUSADO";
        } else {
            btn.innerText = "Pausar";
            btn.className = "btn btn-warn btn-sm";
            controls.classList.remove('hidden');
            renderQuestionUI();
        }
    }

    function restartLevel() {
        if (!confirm("Deseja reiniciar o progresso e o tempo deste nível?")) return;
        const p = profiles[currentProfileName];
        setupLevelState(p, p.level);
        lastShownPair = null;
        if (isPaused) togglePause();
        saveData();
        updateProgressUI();
        updateTimerUI();
        prepareNextRound();
    }

    // ==========================================
    // TELAS: PERFIS E RANKING
    // ==========================================
    function renderRanking() {
        const container = document.getElementById('ranking-container');
        if (ranking.length === 0) {
            container.innerHTML = '<p style="color: #777; font-size: 14px;">Nenhum nível concluído ainda.</p>';
            return;
        }

        const sorted = [...ranking].sort((a, b) => {
            if (b.level !== a.level) return b.level - a.level;
            return a.time - b.time;
        });

        let html = `
            <table class="rank-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Perfil</th>
                        <th>Nível</th>
                        <th>Tempo</th>
                    </tr>
                </thead>
                <tbody>
        `;

        sorted.slice(0, 15).forEach((entry, idx) => {
            html += `
                <tr>
                    <td>${idx + 1}º</td>
                    <td><strong>${entry.name}</strong></td>
                    <td>Nível ${entry.level}</td>
                    <td>${formatTime(entry.time)}</td>
                </tr>
            `;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function showProfilesScreen() {
        stopTimer();
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-profiles').classList.remove('hidden');

        const list = document.getElementById('profile-list');
        list.innerHTML = '';

        Object.keys(profiles).forEach(name => {
            const p = profiles[name];
            const div = document.createElement('div');
            div.className = 'profile-item';
            div.innerHTML = `
                <div>
                    <strong>${name}</strong><br>
                    <small style="color: #555;">Nível Atual: ${p.level} (Máx: ${p.maxLevelUnlocked || p.level})</small>
                </div>
                <button class="btn btn-sm" onclick="startProfile('${name}')">Jogar</button>
            `;
            list.appendChild(div);
        });

        renderRanking();
    }

    function exitToProfiles() {
        saveData();
        showProfilesScreen();
    }

    function createProfile() {
        const input = document.getElementById('new-profile-name');
        const name = input.value.trim();
        if (!name) {
            alert("Digite um nome válido!");
            return;
        }
        if (profiles[name]) {
            alert("Este perfil já existe!");
            return;
        }

        profiles[name] = {};
        setupLevelState(profiles[name], 1);
        saveData();
        input.value = '';
        showProfilesScreen();
    }

    function startProfile(name) {
        currentProfileName = name;
        const p = profiles[currentProfileName];
        ensureProfileIntegrity(p);

        document.getElementById('screen-profiles').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        document.getElementById('user-display').innerText = name;

        lastShownPair = null;
        if (isPaused) togglePause();

        populateLevelSelect();
        updateProgressUI();
        updateTimerUI();
        prepareNextRound();
        startTimer();
    }

    function populateLevelSelect() {
        const p = profiles[currentProfileName];
        const select = document.getElementById('select-level');
        select.innerHTML = '';

        for (let i = 1; i <= p.maxLevelUnlocked; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = i;
            if (i === p.level) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function changeLevel(val) {
        const newLevel = parseInt(val, 10);
        const p = profiles[currentProfileName];
        if (newLevel === p.level) return;

        setupLevelState(p, newLevel);
        lastShownPair = null;
        saveData();
        updateProgressUI();
        updateTimerUI();
        prepareNextRound();
    }

    function updateProgressUI() {
        const p = profiles[currentProfileName];
        const pct = p.totalWeight > 0 ? (p.completedWeight / p.totalWeight) * 100 : 0;
        const clamped = Math.min(100, Math.max(0, pct)).toFixed(2);
        document.getElementById('progress-bar').style.width = clamped + '%';
        document.getElementById('progress-text').innerText = clamped + '%';
    }

    // ==========================================
    // MOTOR CENTRAL DAS RODADAS
    // ==========================================
    function prepareNextRound() {
        const p = profiles[currentProfileName];
        if (p.deck.length === 0 && p.punishments.length === 0) return;

        let candidateA, candidateB, candidateType;
        let candidateDeckIndex = -1;
        let candidatePunishmentIndex = -1;

        // Inicia a varredura do bloco de punições se houver punições ativas e:
        // - já está no meio de um bloco de punições (inPunishmentSweep === true), OU
        // - já se passaram 2 rodadas normais desde a última varredura (normalRoundsSincePunishment >= 2)
        if (p.punishments.length > 0 && (p.inPunishmentSweep || p.normalRoundsSincePunishment >= 2)) {
            if (!p.inPunishmentSweep) {
                p.inPunishmentSweep = true;
                p.punishmentCursor = 0;
            }
            if (p.punishmentCursor >= p.punishments.length) {
                p.punishmentCursor = 0;
            }

            candidatePunishmentIndex = p.punishmentCursor;
            candidateA = p.punishments[candidatePunishmentIndex].a;
            candidateB = p.punishments[candidatePunishmentIndex].b;
            candidateType = 'punishment';
        } else if (p.deck.length > 0) {
            // Sorteia uma carta do baralho normal evitando repetição imediata se houver outra opção no baralho
            let attempts = 0;
            do {
                candidateDeckIndex = Math.floor(Math.random() * p.deck.length);
                candidateA = p.deck[candidateDeckIndex][0];
                candidateB = p.deck[candidateDeckIndex][1];
                attempts++;
            } while (
                attempts < 25 &&
                p.deck.length > 1 &&
                isSameAccount([candidateA, candidateB], lastShownPair)
            );
            candidateType = 'deck';
        } else {
            // Baralho normal acabou, mas há punição pendente: gera conta aleatória de preenchimento
            let rand;
            let attempts = 0;
            do {
                rand = randomAccount(p.level);
                attempts++;
            } while (attempts < 25 && isSameAccount(rand, lastShownPair));

            candidateA = rand[0];
            candidateB = rand[1];
            candidateType = 'filler';
        }

        activeCard = {
            a: candidateA,
            b: candidateB,
            type: candidateType,
            deckIndex: candidateDeckIndex,
            punishmentIndex: candidatePunishmentIndex
        };

        // Alternância estética da ordem dos fatores para não repetir a mesma posição visual
        displayA = candidateA;
        displayB = candidateB;
        if (lastShownPair && displayA === lastShownPair[0] && candidateA !== candidateB) {
            displayA = candidateB;
            displayB = candidateA;
        }

        renderQuestionUI();
        clearAnswer();
    }

    function renderQuestionUI() {
        if (isPaused) return;
        document.getElementById('question-display').innerText = `${displayA} × ${displayB} = ?`;
    }

    // ==========================================
    // TECLADO E SUBMISSÃO DE RESPOSTA
    // ==========================================
    function pressKey(digit) {
        if (isPaused || inputAnswer.length >= 7) return;
        inputAnswer += digit;
        document.getElementById('answer-display').innerText = inputAnswer;
    }

    function clearAnswer() {
        inputAnswer = "";
        document.getElementById('answer-display').innerText = "";
    }

    function backspace() {
        if (isPaused) return;
        inputAnswer = inputAnswer.slice(0, -1);
        document.getElementById('answer-display').innerText = inputAnswer;
    }

    function submitAnswer() {
        if (isPaused || inputAnswer === "" || !activeCard) return;

        const p = profiles[currentProfileName];
        const userAns = parseInt(inputAnswer, 10);
        const correctAns = activeCard.a * activeCard.b;

        lastShownPair = [displayA, displayB];

        if (userAns === correctAns) {
            if (activeCard.type === 'punishment') {
                const idx = activeCard.punishmentIndex;
                p.punishments[idx].remaining--;
                p.completedWeight++;

                if (p.punishments[idx].remaining <= 0) {
                    // Remove a punição concluída; o cursor permanece no mesmo índice pois o próximo elemento desliza para ele
                    p.punishments.splice(idx, 1);
                } else {
                    // Avança para a próxima punição ativa no bloco
                    p.punishmentCursor = idx + 1;
                }

                // Se varreu todas as punições ativas da fila, encerra o bloco e libera 2 rodadas normais
                if (p.punishmentCursor >= p.punishments.length) {
                    p.inPunishmentSweep = false;
                    p.punishmentCursor = 0;
                    p.normalRoundsSincePunishment = 0;
                }
            } else if (activeCard.type === 'deck') {
                if (activeCard.deckIndex >= 0 && activeCard.deckIndex < p.deck.length) {
                    p.deck.splice(activeCard.deckIndex, 1);
                }
                p.completedWeight++;
                if (p.punishments.length > 0) {
                    p.normalRoundsSincePunishment++;
                }
            } else if (activeCard.type === 'filler') {
                if (p.punishments.length > 0) {
                    p.normalRoundsSincePunishment++;
                }
            }

            // Verifica conclusão total do nível
            if (p.deck.length === 0 && p.punishments.length === 0) {
                ranking.push({
                    name: currentProfileName,
                    level: p.level,
                    time: p.timeElapsed
                });

                updateProgressUI();

                if (p.level < 100) {
                    alert(`Parabéns! Você concluiu o Nível ${p.level} em ${formatTime(p.timeElapsed)}!`);
                    setupLevelState(p, p.level + 1);
                    lastShownPair = null;
                    populateLevelSelect();
                } else {
                    alert(`Incrível! Você zerou todos os 100 níveis em ${formatTime(p.timeElapsed)}!`);
                }
            }
        } else {
            // ERRO DO JOGADOR
            alert(`Errou! O resultado de ${displayA} × ${displayB} é ${correctAns}.
Esta conta aparecerá no bloco de punições a cada 2 rodadas até você acertá-la 10 vezes.`);

            const existingIdx = p.punishments.findIndex(item =>
                isSameAccount([item.a, item.b], [activeCard.a, activeCard.b])
            );

            if (existingIdx !== -1) {
                // Reinicia a contagem para 10
                const missingToTen = 10 - p.punishments[existingIdx].remaining;
                p.punishments[existingIdx].remaining = 10;
                p.totalWeight += missingToTen;

                // Se errou durante o bloco de punições, avança o cursor para não repetir a mesma conta imediatamente
                if (activeCard.type === 'punishment') {
                    p.punishmentCursor = existingIdx + 1;
                    if (p.punishmentCursor >= p.punishments.length) {
                        p.inPunishmentSweep = false;
                        p.punishmentCursor = 0;
                        p.normalRoundsSincePunishment = 0;
                    }
                }
            } else {
                // Adiciona nova punição de 10 repetições no final da fila
                p.punishments.push({
                    a: activeCard.a,
                    b: activeCard.b,
                    remaining: 10
                });
                p.totalWeight += 10;

                // Se esta for a primeira punição da fila (ou se não estava em varredura),
                // já marca normalRoundsSincePunishment = 2 para cobrar o bloco imediatamente na próxima rodada!
                if (!p.inPunishmentSweep) {
                    p.normalRoundsSincePunishment = 2;
                }
            }
        }

        saveData();
        updateProgressUI();
        prepareNextRound();
    }

    // ==========================================
    // SUPORTE A TECLADO FÍSICO (PC)
    // ==========================================
    document.addEventListener('keydown', (e) => {
        const gameScreen = document.getElementById('screen-game');
        if (gameScreen.classList.contains('hidden') || isPaused) return;

        if (/^[0-9]$/.test(e.key)) {
            pressKey(e.key);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            submitAnswer();
        } else if (e.key === 'Backspace') {
            e.preventDefault();
            backspace();
        } else if (e.key === 'Delete' || e.key.toLowerCase() === 'c') {
            clearAnswer();
        }
    });

    showProfilesScreen();
</script>

</body>
</html>
